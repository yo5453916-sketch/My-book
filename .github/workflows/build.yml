name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['maktabati-app.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files and libs
        run: |
          unzip -o maktabati-app.zip -d www
          cd www/libs
          curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js
          curl -fsSL -O https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          curl -fsSL -o docx.js https://unpkg.com/docx@8.5.0/build/index.js
          cd ..
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#libs/#g; s#https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/#libs/#g; s#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/#libs/#g; s#https://unpkg.com/docx@8.5.0/build/index.js#libs/docx.js#g' index.html
          cp icon-512.png ../icon.png
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "My-book" com.maktabati.app --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/#FFFFFF/#0b3d2e/' android/app/src/main/res/values/ic_launcher_background.xml
          for d in android/app/src/main/res/mipmap-*; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon.png $d/$f.png; done
          done
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: maktabati-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
